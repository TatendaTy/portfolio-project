[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swcpy-tydennis0501"
version = "0.0.3"
authors = [
    { name="[Tatenda Kabanda]" },
    ]
description = "An educational SDK for AI and Data Science on the SWC Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    'pytest>=8.1',
    'httpx>=0.27.0',
    'pydantic>=2.4.0',
    'backoff>=2.2.1',
    'pyarrow>=16.0',
    'pandas>=2.0.0',
    'python-dotenv',
]

